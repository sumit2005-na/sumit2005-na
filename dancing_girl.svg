<svg width="220" height="260" viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
  <style>
    .dancer {
      transform-origin: 110px 200px;
      animation: sway 1s ease-in-out infinite alternate;
    }
    .armL {
      transform-origin: 78px 120px;
      animation: armSwingL 1s ease-in-out infinite alternate;
    }
    .armR {
      transform-origin: 142px 120px;
      animation: armSwingR 1s ease-in-out infinite alternate;
    }
    .legL {
      transform-origin: 95px 190px;
      animation: legSwingL 1s ease-in-out infinite alternate;
    }
    .legR {
      transform-origin: 125px 190px;
      animation: legSwingR 1s ease-in-out infinite alternate;
    }
    .hair {
      transform-origin: 110px 70px;
      animation: hairFlip 1s ease-in-out infinite alternate;
    }
    @keyframes sway {
      0%   { transform: rotate(-6deg) translateY(0px); }
      100% { transform: rotate(6deg) translateY(-8px); }
    }
    @keyframes armSwingL {
      0%   { transform: rotate(-25deg); }
      100% { transform: rotate(35deg); }
    }
    @keyframes armSwingR {
      0%   { transform: rotate(25deg); }
      100% { transform: rotate(-35deg); }
    }
    @keyframes legSwingL {
      0%   { transform: rotate(10deg); }
      100% { transform: rotate(-15deg); }
    }
    @keyframes legSwingR {
      0%   { transform: rotate(-10deg); }
      100% { transform: rotate(15deg); }
    }
    @keyframes hairFlip {
      0%   { transform: rotate(-8deg); }
      100% { transform: rotate(8deg); }
    }
  </style>

  <g class="dancer">
    <!-- back hair -->
    <path class="hair" d="M75 60 Q60 110 80 140 Q70 100 90 70 Z" fill="#5B3A9E"/>
    <path class="hair" d="M145 60 Q160 110 140 140 Q150 100 130 70 Z" fill="#5B3A9E"/>

    <!-- legs -->
    <rect class="legL" x="90" y="190" width="14" height="55" rx="7" fill="#2E2B5F"/>
    <rect class="legR" x="116" y="190" width="14" height="55" rx="7" fill="#2E2B5F"/>

    <!-- shoes -->
    <ellipse cx="97" cy="248" rx="12" ry="7" fill="#FF6F91"/>
    <ellipse cx="123" cy="248" rx="12" ry="7" fill="#FF6F91"/>

    <!-- dress/body -->
    <path d="M85 120 Q110 105 135 120 L145 195 Q110 210 75 195 Z" fill="#FF6F91"/>
    <path d="M85 120 Q110 105 135 120 L138 150 Q110 160 82 150 Z" fill="#FFB6C1"/>

    <!-- arms -->
    <rect class="armL" x="72" y="118" width="12" height="50" rx="6" fill="#FFD6C4"/>
    <rect class="armR" x="136" y="118" width="12" height="50" rx="6" fill="#FFD6C4"/>

    <!-- neck -->
    <rect x="103" y="95" width="14" height="16" fill="#FFD6C4"/>

    <!-- head -->
    <circle cx="110" cy="75" r="32" fill="#FFD6C4"/>

    <!-- front hair -->
    <path class="hair" d="M78 65 Q90 30 110 35 Q130 30 142 65 Q135 45 110 45 Q85 45 78 65 Z" fill="#6C4AB6"/>
    <path class="hair" d="M78 65 Q75 90 85 100 Q78 80 84 65 Z" fill="#6C4AB6"/>
    <path class="hair" d="M142 65 Q145 90 135 100 Q142 80 136 65 Z" fill="#6C4AB6"/>

    <!-- eyes -->
    <ellipse cx="99" cy="78" rx="5" ry="7" fill="#2E2B5F"/>
    <ellipse cx="121" cy="78" rx="5" ry="7" fill="#2E2B5F"/>
    <circle cx="100.5" cy="75" r="1.5" fill="#fff"/>
    <circle cx="122.5" cy="75" r="1.5" fill="#fff"/>

    <!-- blush -->
    <ellipse cx="92" cy="88" rx="5" ry="3" fill="#FFB6C1" opacity="0.7"/>
    <ellipse cx="128" cy="88" rx="5" ry="3" fill="#FFB6C1" opacity="0.7"/>

    <!-- smile -->
    <path d="M102 92 Q110 98 118 92" stroke="#B45361" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- hair bow -->
    <path d="M138 55 L150 48 L150 62 Z" fill="#FF6F91"/>
    <path d="M138 55 L126 48 L126 62 Z" fill="#FF6F91"/>
    <circle cx="138" cy="55" r="4" fill="#E14C6C"/>
  </g>

  <!-- sparkles -->
  <circle cx="35" cy="60" r="3" fill="#FFD700">
    <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="190" cy="90" r="2.5" fill="#FFD700">
    <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="45" cy="150" r="2" fill="#FF6F91">
    <animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="170" r="3" fill="#FF6F91">
    <animate attributeName="opacity" values="0;1;0" dur="1.1s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
</svg>
