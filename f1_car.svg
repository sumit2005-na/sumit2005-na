<svg width="100%" height="140" viewBox="0 0 800 140" xmlns="http://www.w3.org/2000/svg">
  <style>
    .track-line {
      stroke-dasharray: 20 15;
      animation: dashMove 0.6s linear infinite;
    }
    @keyframes dashMove {
      0%   { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -35; }
    }
    .car {
      animation: driveAcross 4s linear infinite;
    }
    @keyframes driveAcross {
      0%   { transform: translateX(-220px); }
      100% { transform: translateX(900px); }
    }
    .wheel {
      transform-origin: center;
      animation: spin 0.25s linear infinite;
    }
    @keyframes spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .smoke {
      animation: puff 0.8s ease-out infinite;
    }
    @keyframes puff {
      0%   { opacity: 0.6; transform: scale(0.6) translateX(0); }
      100% { opacity: 0; transform: scale(1.4) translateX(-25px); }
    }
  </style>

  <!-- road -->
  <rect x="0" y="95" width="800" height="35" fill="#2b2b2b"/>
  <line class="track-line" x1="0" y1="112" x2="800" y2="112" stroke="#ffffff" stroke-width="4"/>

  <g class="car">
    <!-- exhaust smoke -->
    <circle class="smoke" cx="10" cy="100" r="6" fill="#bbbbbb"/>
    <circle class="smoke" cx="5" cy="103" r="4" fill="#cccccc" style="animation-delay:0.3s"/>

    <!-- rear wing -->
    <rect x="15" y="60" width="8" height="22" fill="#1a1a1a"/>
    <rect x="10" y="58" width="18" height="6" fill="#e63946"/>

    <!-- body -->
    <path d="M25 95 L35 78 L95 72 L115 80 L120 95 Z" fill="#e63946"/>
    <path d="M35 78 L95 72 L100 80 L40 84 Z" fill="#ffffff"/>

    <!-- cockpit -->
    <path d="M55 78 Q65 65 78 72 L78 80 L55 80 Z" fill="#1a1a1a"/>

    <!-- front nose -->
    <path d="M115 80 L135 85 L132 93 L118 95 Z" fill="#e63946"/>

    <!-- front wing -->
    <rect x="128" y="90" width="14" height="5" fill="#1a1a1a"/>

    <!-- number plate -->
    <circle cx="70" cy="76" r="7" fill="#ffffff"/>
    <text x="70" y="80" font-size="9" font-family="Arial" font-weight="bold" fill="#1a1a1a" text-anchor="middle">7</text>

    <!-- wheels -->
    <g class="wheel">
      <circle cx="40" cy="98" r="15" fill="#1a1a1a"/>
      <circle cx="40" cy="98" r="6" fill="#888888"/>
    </g>
    <g class="wheel">
      <circle cx="108" cy="98" r="15" fill="#1a1a1a"/>
      <circle cx="108" cy="98" r="6" fill="#888888"/>
    </g>
  </g>
</svg>
